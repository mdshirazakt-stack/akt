<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Apno Ki Talash - Under Development</title>
<link rel="icon" type="image/png" href="apnonkitalash-icon-light.png"/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #faf7f2;
    --surface: rgba(255,255,255,0.9);
    --border: #d9c89d;
    --ink: #264532;
    --muted: #6f6659;
    --gold: #9a6f2f;
    --gold2: #c9a84c;
    --green: #2f4d37;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: 'Lato', sans-serif;
    color: var(--ink);
    background:
      linear-gradient(135deg, rgba(250,247,242,0.92), rgba(223,232,216,0.9)),
      url('apnonkitalash-logo-favicon.png') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
  }
  .page {
    width: min(720px, 100%);
    background: var(--surface);
    border: 1px solid rgba(201,168,76,0.45);
    border-top: 4px solid var(--gold2);
    box-shadow: 0 24px 70px rgba(47,77,55,0.18);
    text-align: center;
    padding: clamp(34px, 7vw, 62px);
  }
  .mark {
    width: 96px;
    height: 96px;
    margin: 0 auto 18px;
    border: 1px solid rgba(201,168,76,0.45);
    background: #f8f1e5;
    box-shadow: 0 14px 32px rgba(92,61,17,0.13);
    overflow: hidden;
  }
  .mark img { width: 100%; height: 100%; object-fit: cover; }
  .urdu {
    font-family: 'Amiri', serif;
    font-size: clamp(2.4rem, 8vw, 4rem);
    direction: rtl;
    line-height: 1.1;
    color: var(--ink);
  }
  .brand {
    margin-top: 4px;
    color: var(--gold);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 700;
    font-size: 0.8rem;
  }
  .rule {
    width: min(360px, 70%);
    height: 1px;
    margin: 26px auto;
    background: linear-gradient(90deg, transparent, var(--gold2), transparent);
  }
  h1 {
    font-family: 'Amiri', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.15;
    margin-bottom: 14px;
    color: var(--ink);
  }
  p {
    color: var(--muted);
    font-size: clamp(1rem, 2vw, 1.12rem);
    line-height: 1.75;
    max-width: 560px;
    margin: 0 auto;
  }
  .note {
    margin-top: 24px;
    color: #7fa070;
    font-weight: 700;
    font-size: 0.9rem;
  }
  .actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 28px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 13px 20px;
    border: 1px solid var(--gold);
    background: var(--green);
    color: #fff;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
    font-size: 0.78rem;
  }
  .btn.secondary {
    background: transparent;
    color: var(--ink);
    border-color: var(--border);
  }
</style>
</head>
<body>
  <main class="page" aria-label="Apno Ki Talash under development">
    <div class="mark"><img src="apnonkitalash-icon-light.png" alt="Apno Ki Talash logo"/></div>
    <div class="urdu">اپنوں کی تلاش</div>
    <div class="brand">Apno Ki Talash</div>
    <div class="rule"></div>
    <h1>Website Under Development</h1>
    <p>
      This family heritage platform is currently being prepared and reviewed.
      We will announce once it is publicly available.
    </p>
    <div class="actions">
      <a class="btn" href="forum.html">Community Forum</a>
    </div>
    <div class="note">Thank you for your patience.</div>
  </main>
</body>
</html>
